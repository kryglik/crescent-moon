[package]
name = "rmc"
version = "0.1.0"
edition = "2024"
description = "A small Midnight Commander-style two-panel file manager for the terminal"

[dependencies]
ratatui = "0.30"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
trash = "5"
unicode-width = "0.2"
portable-pty = "0.9"
vt100 = "0.18"
ignore = "0.4.34"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
