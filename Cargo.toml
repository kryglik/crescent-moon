[package]
name = "crescent-moon"
version = "0.1.0"
edition = "2024"
description = "Crescent Moon: a small Midnight Commander-style two-panel file manager for the terminal"
license = "MIT OR Apache-2.0"

[[bin]]
name = "cm"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
trash = "5"
unicode-width = "0.2"
portable-pty = "0.9"
vt100 = "0.18"
ignore = "0.4.34"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
# Zip archives: reading (deflate and stored) and writing, in pure Rust.
zip = { version = "9.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# crossterm 0.29.0 with one fix, for Konsole's Alt+F1 and the like: see vendor/README.md.
[patch.crates-io]
crossterm = { path = "vendor/crossterm" }
